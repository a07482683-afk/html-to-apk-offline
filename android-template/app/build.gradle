plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.htmlapp'
    compileSdk 35

    defaultConfig {
        // These are valid defaults for the sample APK. The desktop converter
        // replaces them with the user's package ID and selected minimum API.
        applicationId 'com.example.htmlapp'
        minSdk 14
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }
}
