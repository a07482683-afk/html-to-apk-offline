name: Build applications

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-exe:
    name: Windows portable EXE
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8.10'
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller==5.13.2
      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name HTML-to-APK app.py
      - uses: actions/upload-artifact@v4
        with:
          name: HTML-to-APK-Windows
          path: dist/HTML-to-APK.exe
          if-no-files-found: error

  android-apk:
    name: Sample Android APK
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build sample APK
        run: gradle --no-daemon assembleDebug
        working-directory: android-template
      - uses: actions/upload-artifact@v4
        with:
          name: HTML-to-APK-Android-Sample
          path: android-template/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
